<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="author" content="Hsin Pai">
  <meta name="color-scheme" content="light dark">
  <title>行程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    /* 視覺概念：冬夜北海道。頂幅是夜空＋飄雪，旅程用 JR 路線圖的方式呈現（一站＝一天，線段顏色＝交通型態），
       每日內容是左側有時間線的 timeline。冷藍是底色，暖燈色只留給「點燈」。 */
    :root {
      --bg: #edf2f7; --surface: #ffffff; --surface2: #f5f8fb; --sunken: #e3eaf2;
      --fg: #0e1724; --muted: #5a6b7f; --faint: #8da0b5; --line: #d5dee8;
      --accent: #1f5f8b; --accent-soft: #dfeaf4;
      --warm: #a16a14; --warm-soft: #f9eed6; --warm-glow: rgba(224,168,94,.35);
      --teal: #1f7a6d; --teal-soft: #dcf0ec;
      --ok: #2c7355; --ok-soft: #dff0e7;
      --alert: #a23d1a; --alert-soft: #fae6dd;
      --hero-a: #cfdff0; --hero-b: #e6eef7; --snow: rgba(90,120,160,.55); --hero-fg: #0e1724; --hero-muted: #4a5c72;
      --serif: "LXGW WenKai TC", "Songti TC", "Noto Serif TC", serif;
      --sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090f16; --surface: #121a24; --surface2: #182230; --sunken: #0d141c;
        --fg: #e8eef5; --muted: #93a3b6; --faint: #6c7d91; --line: #233040;
        --accent: #7cb8e2; --accent-soft: #15303f;
        --warm: #e5ad5e; --warm-soft: #33270f; --warm-glow: rgba(229,173,94,.28);
        --teal: #5fc4b4; --teal-soft: #11302c;
        --ok: #62bb8e; --ok-soft: #12291f;
        --alert: #e8886b; --alert-soft: #321a12;
        --hero-a: #0a1830; --hero-b: #0f2546; --snow: rgba(255,255,255,.85); --hero-fg: #f1f5fa; --hero-muted: #a9bbd0;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.62; font-size: 15px; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); }
    .wrap { max-width: 900px; margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

    /* ---------- hero：夜空、飄雪、路線圖 ---------- */
    .hero { position: relative; overflow: hidden; color: var(--hero-fg);
      background: linear-gradient(180deg, var(--hero-a) 0%, var(--hero-b) 70%, var(--bg) 100%);
      padding-top: env(safe-area-inset-top, 0px); }
    .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .hero .wrap { position: relative; padding-block: 22px 18px; }
    .crumb { font-size: .76rem; color: var(--hero-muted); margin-bottom: 10px; }
    .crumb a { color: inherit; text-decoration: none; }
    .crumb a:hover { color: var(--hero-fg); }
    .brand h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.15; margin: 0; letter-spacing: .02em; text-wrap: balance; }
    .brand .range { display: inline-block; margin-top: 6px; font-family: var(--mono); font-size: .8rem; color: var(--hero-muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    .modeline { margin-top: 8px; font-size: .84rem; color: var(--hero-muted); max-width: 60ch; }
    /* 倒數：出發前倒數天數、旅程中顯示第幾天、結束後顯示幾天前 */
    .countdown { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 10px 16px; border-radius: 14px; width: fit-content; max-width: 100%;
      background: color-mix(in srgb, var(--hero-fg) 9%, transparent); border: 1px solid color-mix(in srgb, var(--hero-fg) 18%, transparent); }
    .countdown .n { font-family: var(--serif); font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .countdown .n small { font-family: var(--sans); font-size: .78rem; margin-left: 3px; color: var(--hero-muted); }
    .countdown .lbl { font-size: .82rem; color: var(--hero-muted); line-height: 1.45; }
    .countdown .lbl b { display: block; color: var(--hero-fg); font-weight: 600; }
    .countdown .lbl a { color: var(--hero-fg); }
    .day.today { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .todaytag { display: inline-block; font-size: .64rem; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--surface); margin-left: 6px; vertical-align: middle; letter-spacing: .06em; }

    /* 路線圖：一站一天，線段顏色＝交通型態 */
    .route { position: relative; margin-top: 26px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .route::-webkit-scrollbar { display: none; }
    .route ol { list-style: none; margin: 0; padding: 0; display: flex; min-width: max-content; }
    .stop { position: relative; display: flex; flex-direction: column; align-items: center; width: 92px; text-decoration: none; color: inherit; cursor: pointer; }
    .stop .seg { position: absolute; top: 25px; left: 50%; width: 100%; height: 3px; background: var(--seg, rgba(128,150,180,.45)); }
    .stop:last-child .seg { display: none; }
    .stop .dn { font-family: var(--mono); font-size: .68rem; color: var(--hero-muted); letter-spacing: .06em; height: 16px; }
    .stop .dot { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%; background: var(--hero-b); border: 3px solid var(--seg, var(--hero-muted)); margin: 3px 0 6px; transition: transform .15s; }
    .stop .pl { font-size: .8rem; font-weight: 500; white-space: nowrap; }
    .stop .dt { font-family: var(--mono); font-size: .66rem; color: var(--hero-muted); font-variant-numeric: tabular-nums; }
    .stop:hover .dot { transform: scale(1.2); }
    .stop.on .dot { background: var(--seg, var(--hero-fg)); box-shadow: 0 0 0 5px color-mix(in srgb, var(--seg, #fff) 25%, transparent); }
    .stop.on .pl { font-weight: 700; }
    .leg-rail { --seg: #7cb8e2; } .leg-drive { --seg: #e5ad5e; } .leg-city { --seg: #5fc4b4; }
    @media (prefers-color-scheme: light) { .leg-rail { --seg: #1f5f8b; } .leg-drive { --seg: #b5781c; } .leg-city { --seg: #1f7a6d; } }
    .legend { display: flex; gap: 14px; margin-top: 8px; font-size: .7rem; color: var(--hero-muted); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: var(--seg); }

    /* ---------- sticky 小導覽 ---------- */
    .top { position: sticky; top: 0; z-index: 9; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .rail { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .rail a { flex: none; font-size: .76rem; padding: 4px 11px; border-radius: 999px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
    .rail a:hover { color: var(--fg); }
    .rail a.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }

    /* ---------- 區塊 ---------- */
    main { padding-block: 26px 72px; display: flex; flex-direction: column; gap: 42px; }
    section { scroll-margin-top: 64px; }
    .shead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .shead .eyebrow { display: block; font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; color: var(--faint); margin-bottom: 2px; }
    .shead h2 { font-family: var(--serif); font-weight: 700; font-size: 1.45rem; margin: 0; letter-spacing: .02em; line-height: 1.2; }
    .shead .sub { font-size: .78rem; color: var(--muted); }

    /* ---------- 每日 timeline 卡片 ---------- */
    .days { display: flex; flex-direction: column; gap: 18px; }
    .day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 64px; }
    .dhead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 16px 18px 14px; background: var(--surface2); border-bottom: 1px solid var(--line); position: relative; }
    .dhead::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--seg, var(--line)); }
    .dnum { font-family: var(--serif); font-size: 2.4rem; line-height: .9; color: var(--seg, var(--accent)); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; }
    .dnum small { display: block; font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; color: var(--faint); margin-bottom: 4px; }
    .dmeta { min-width: 0; }
    .ddate { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
    .ddate .place { font-family: var(--sans); font-size: .72rem; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--seg, var(--accent)) 16%, transparent); color: var(--seg, var(--accent)); font-weight: 500; }
    .dtitle { font-weight: 700; font-size: 1.05rem; line-height: 1.4; margin-top: 4px; text-wrap: balance; }
    .dtrans { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: .78rem; color: var(--muted); }
    .dtrans svg { flex: none; color: var(--seg, var(--accent)); }
    .cover { display: block; width: 100%; max-height: 220px; object-fit: cover; }
    /* 日照時間軸：06:00–24:00，日出前與日落後是夜色，行程以色點落在真實時間位置，點一下跳到該項目 */
    .daybar { padding: 10px 18px 0; }
    .daybar .cap { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; font-size: .66rem; color: var(--faint); margin-bottom: 8px; }
    .daybar .cap b { font-weight: 600; color: var(--muted); }
    .daybar .legend { display: flex; gap: 10px; flex-wrap: wrap; }
    .daybar .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .daybar .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--k, var(--faint)); display: inline-block; }
    .daybar .track { position: relative; height: 10px; border-radius: 999px; overflow: visible;
      background: linear-gradient(90deg, var(--night, #1b2d4a) 0 var(--rise, 0%), var(--daylight, #cfe3f6) var(--rise, 0%) var(--set, 56%), var(--night, #1b2d4a) var(--set, 56%) 100%); }
    .daybar .track::after { content: ""; position: absolute; left: var(--set, 56%); top: -4px; width: 2px; height: 18px; background: var(--warm); margin-left: -1px; }
    .daybar .hr { position: absolute; top: 12px; width: 1px; height: 4px; background: var(--faint); opacity: .6; }
    .daybar .pt { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--k, var(--faint)); box-shadow: 0 0 0 2px var(--surface); cursor: pointer; transition: transform .12s; }
    .daybar .pt:hover { transform: scale(1.35); z-index: 1; }
    .daybar .pt.lit { box-shadow: 0 0 0 2px var(--surface), 0 0 8px 2px var(--warm-glow); }
    .daybar .ticks { position: relative; height: 16px; margin-top: 6px; font-family: var(--mono); font-size: .62rem; color: var(--faint); font-variant-numeric: tabular-nums; }
    .daybar .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
    .daybar .ticks span.first { transform: none; }
    .daybar .ticks span.last { transform: translateX(-100%); }
    .daybar .ticks .set { color: var(--warm); font-weight: 600; }
    @media (max-width: 480px) { .daybar .ticks .minor { display: none; } }
    .it.flash > .body { animation: flash 1.6s ease-out; border-radius: 8px; }
    @keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }
    :root { --daylight: #cfe3f6; --night: #1b2d4a; }
    @media (prefers-color-scheme: dark) { :root { --daylight: #3a5f85; --night: #0a1424; } }
    .items { list-style: none; margin: 0; padding: 10px 18px 16px; display: flex; flex-direction: column; }
    .it { display: grid; grid-template-columns: 54px 22px 1fr; gap: 0 8px; align-items: start; position: relative; padding: 7px 0; }
    .it .time { font-family: var(--mono); font-size: .76rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; text-align: right; }
    .it .tl { position: relative; align-self: stretch; }
    .it .tl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--line); }
    .it:first-child .tl::before { top: 12px; }
    .it:last-child .tl::before { bottom: calc(100% - 12px); }
    .it .tl i { position: absolute; left: 50%; top: 4px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--k, var(--faint)); box-shadow: 0 0 0 3px var(--surface); display: grid; place-items: center; color: var(--surface); }
    .it .tl i svg { width: 12px; height: 12px; }
    .booked { display: inline-block; font-size: .64rem; padding: 1px 7px; border-radius: 999px; background: var(--ok); color: var(--surface); letter-spacing: .06em; font-weight: 500; }
    .it .body { min-width: 0; padding-bottom: 2px; }
    .kindrow { display: flex; align-items: center; gap: 6px; margin-bottom: 1px; }
    .kind { font-size: .64rem; padding: 1px 7px; border-radius: 999px; letter-spacing: .06em; white-space: nowrap; background: color-mix(in srgb, var(--k, var(--faint)) 15%, transparent); color: var(--k, var(--muted)); font-weight: 500; }
    .k-move { --k: var(--accent); } .k-see { --k: var(--teal); } .k-eat { --k: var(--ok); } .k-lit { --k: var(--warm); } .k-stay { --k: var(--accent); } .k-warn { --k: var(--alert); }
    .it .text { font-size: .9rem; }
    .it .map { font-size: .72rem; margin-left: 6px; white-space: nowrap; text-decoration: none; font-family: var(--mono); }
    .it .map:hover { text-decoration: underline; }
    .it.lit .tl i { box-shadow: 0 0 0 3px var(--surface), 0 0 14px 4px var(--warm-glow); }
    .it.warn .tl i { background: var(--alert); }
    .it.warn .body { background: var(--alert-soft); border-radius: 9px; padding: 6px 10px; margin-top: 2px; border-left: 3px solid var(--alert); }
    .it.warn .time { opacity: .35; }

    /* 移動：乘車券式卡片（items[] 有 from/to 的 move 項目） */
    .ride { margin-top: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); overflow: hidden; }
    .ride .rhead { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; padding: 8px 12px 4px; flex-wrap: wrap; }
    .ride .route { font-weight: 700; font-size: .96rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ride .route .arrow { color: var(--accent); font-weight: 400; }
    .ride .via { font-size: .72rem; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 500; }
    .ride .rtime { display: flex; align-items: baseline; gap: 8px; padding: 0 12px 8px; font-family: var(--mono); font-size: .78rem; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
    .ride .rtime b { font-size: .98rem; font-weight: 500; color: var(--fg); }
    .ride .rtime .arrow { color: var(--accent); }
    .ride .rtime .dur { color: var(--muted); font-size: .72rem; font-family: var(--sans); }
    .ride dl { margin: 0; padding: 7px 12px 9px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: .84rem; }
    .ride dt { color: var(--faint); font-size: .7rem; padding-top: 3px; white-space: nowrap; letter-spacing: .04em; }
    .ride dd { margin: 0; }
    .ride dd.hl { color: var(--fg); font-weight: 500; }
    .ride .rhead .map { margin-left: 0; }
    .ride dd .map { margin-left: 6px; font-weight: 400; }
    .ticket { display: inline-block; font-size: .64rem; padding: 1px 7px; border-radius: 999px; background: var(--warm-soft); color: var(--warm); letter-spacing: .06em; font-weight: 500; }

    /* ---------- 住宿 ---------- */
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .86rem; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--surface2); font-family: var(--mono); font-weight: 500; font-size: .66rem; letter-spacing: .12em; color: var(--faint); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.per { font-weight: 600; color: var(--fg); }
    td .name { font-weight: 700; font-size: .92rem; }
    td .name a { text-decoration: none; color: inherit; border-bottom: 1px dotted var(--accent); }
    td .area { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .flagnote { font-size: .74rem; color: var(--warm); margin-top: 3px; }
    tfoot td { border-top: 2px solid var(--line); background: var(--surface2); font-weight: 700; }
    tfoot td.num { font-size: 1rem; }
    .staycards { display: none; }

    /* ---------- 費用 ---------- */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .kpi .k { font-family: var(--mono); font-size: .64rem; letter-spacing: .12em; color: var(--faint); }
    .kpi .v { font-family: var(--serif); font-size: 1.5rem; line-height: 1.2; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .kpi .s { font-size: .74rem; color: var(--muted); }
    .costwrap { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
    .costwrap table { min-width: 0; }
    .costwrap td .sub { font-size: .74rem; color: var(--muted); margin-top: 2px; }
    .costwrap td.num .twd { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
    .st { display: inline-block; font-size: .64rem; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
    .st-paid { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
    .st-due { background: var(--warm-soft); color: var(--warm); }
    .st-onsite { background: var(--accent-soft); color: var(--accent); }
    .st-tbd { background: var(--sunken); color: var(--muted); }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
    .cats span { font-size: .76rem; padding: 3px 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .cats span b { font-family: var(--mono); font-weight: 500; margin-left: 4px; }
    /* 旅途記帳：存在瀏覽器 localStorage */
    .spend { margin-top: 24px; }
    .spend h3 { font-family: var(--serif); font-size: 1.1rem; margin: 0 0 4px; }
    .spend .hint { font-size: .76rem; color: var(--muted); margin: 0 0 10px; }
    .sform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .sform input, .sform select, .sform button, .stools button, .stools textarea { font: inherit; font-size: .88rem; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .sform .wide { grid-column: 1 / -1; }
    .sform button, .stools button { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; cursor: pointer; }
    .stools button.ghost { background: var(--surface2); color: var(--fg); border-color: var(--line); font-weight: 500; }
    .slist { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .sday { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .sday h4 { margin: 0; padding: 8px 12px; font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; color: var(--faint); font-weight: 500; background: var(--surface2); display: flex; justify-content: space-between; }
    .srow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: .88rem; }
    .srow .m { font-size: .72rem; color: var(--muted); }
    .srow .a { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .srow .x { background: none; border: 0; color: var(--faint); font-size: 1.1rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    .stools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
    .stools .msg { font-size: .76rem; color: var(--muted); }
    .stools textarea { width: 100%; min-height: 90px; font-family: var(--mono); font-size: .74rem; }
    .stotal { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-top: 10px; font-size: .88rem; color: var(--muted); }
    .stotal b { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }

    /* ---------- 待辦 ---------- */
    .progress { display: flex; align-items: center; gap: 10px; font-size: .78rem; color: var(--muted); }
    .progress .bar { width: 140px; height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
    .progress .bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .4s; }
    .todogroup { margin-bottom: 18px; }
    .todogroup h3 { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; color: var(--faint); font-weight: 500; margin: 0 0 8px; }
    .todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .td { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
    .td .box { width: 16px; height: 16px; border: 1.5px solid var(--faint); border-radius: 4px; margin-top: 4px; display: grid; place-items: center; font-size: .7rem; color: var(--surface); }
    .td.done .box { background: var(--ok); border-color: var(--ok); }
    .td.done .txt { color: var(--faint); text-decoration: line-through; }

    /* ---------- 討論 ---------- */
    .notes { display: flex; flex-direction: column; gap: 12px; }
    .note { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 18px; }
    .note::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--teal); }
    .nmeta { display: flex; gap: 8px; align-items: baseline; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
    .nmeta .who { font-weight: 700; color: var(--fg); }
    .nmeta .at { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .note p { margin: 0; font-size: .9rem; white-space: pre-wrap; }

    .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--muted); font-size: .86rem; background: var(--surface); }
    .empty b { display: block; color: var(--fg); font-size: .95rem; margin-bottom: 5px; font-family: var(--serif); }
    .foot { font-size: .74rem; color: var(--faint); text-align: center; padding-top: 6px; }
    .foot code { font-family: var(--mono); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 560px) {
      .it { grid-template-columns: 46px 20px 1fr; }
      .dnum { font-size: 2rem; }
      .stop { width: 78px; }
      main { gap: 34px; }
      /* 住宿：手機改卡片 */
      .tablewrap { display: none; }
      .staycards { display: flex; flex-direction: column; gap: 10px; }
      .sc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
      .sc .name { font-weight: 700; font-size: .95rem; }
      .sc .name a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--accent); }
      .sc .dates { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .sc .price { grid-row: 1 / span 2; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .sc .price b { display: block; font-size: 1.05rem; }
      .sc .price small { color: var(--muted); font-size: .7rem; }
      .sc .area { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; }
      .sc .flagnote { grid-column: 1 / -1; }
      .sc.total { background: var(--surface2); }
      .sc.total .name { font-family: var(--serif); }
    }
  </style>
</head>
<body>
  <header class="hero">
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="wrap">
      <div class="crumb"><a href="index.html">← 所有旅程</a></div>
      <div class="brand">
        <h1 id="trip-title">載入中…</h1>
        <span class="range" id="trip-range"></span>
      </div>
      <div class="modeline" id="trip-mode" hidden></div>
      <div class="countdown" id="countdown" hidden></div>
      <nav class="route" aria-label="旅程路線"><ol id="route"></ol></nav>
      <div class="legend" id="legend" hidden>
        <span class="leg-rail"><i></i>鐵路</span><span class="leg-drive"><i></i>自駕</span><span class="leg-city"><i></i>市區</span>
      </div>
    </div>
  </header>

  <div class="top"><div class="wrap"><nav class="rail" id="rail"></nav></div></div>

  <main class="wrap">
    <section id="sec-plan">
      <div class="shead"><div><span class="eyebrow">ITINERARY</span><h2>逐日行程</h2></div><span class="sub" id="plan-sub"></span></div>
      <div class="days" id="days"><div class="empty"><b>行程載入中</b></div></div>
    </section>
    <section id="sec-stay">
      <div class="shead"><div><span class="eyebrow">STAYS</span><h2>住宿</h2></div><span class="sub">金額為 1 房 2 大人的房價（TWD）</span></div>
      <div id="stays"></div>
    </section>
    <section id="sec-cost">
      <div class="shead"><div><span class="eyebrow">BUDGET</span><h2>費用</h2></div><span class="sub" id="cost-sub"></span></div>
      <div id="costs"></div>
      <div class="spend" id="spend"></div>
    </section>
    <section id="sec-todo">
      <div class="shead"><div><span class="eyebrow">CHECKLIST</span><h2>出發前待辦</h2></div><div class="progress" id="todo-progress" hidden><div class="bar"><i id="todo-bar"></i></div><span id="todo-count"></span></div></div>
      <div id="todos"></div>
    </section>
    <section id="sec-talk">
      <div class="shead"><div><span class="eyebrow">OPEN QUESTIONS</span><h2>討論中</h2></div><span class="sub">還沒定案的事</span></div>
      <div class="notes" id="notes"></div>
    </section>
    <p class="foot" id="foot"></p>
  </main>

  <script src="trips/index.js"></script>
  <script>
  (function () {
    "use strict";
    var KINDS = { move: "移動", see: "景點", eat: "吃", lit: "點燈", stay: "住宿", warn: "提醒" };
    function $(id) { return document.getElementById(id); }
    function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
    function fmt(n) { return (Number(n) || 0).toLocaleString("en-US"); }

    /* ---------- 飄雪（尊重減少動態設定；分頁隱藏時暫停） ---------- */
    (function snow() {
      var c = $("snow"); if (!c || !c.getContext) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { c.remove(); return; }
      var ctx = c.getContext("2d"), flakes = [], W = 0, H = 0, raf = 0;
      function size() { var r = c.parentNode.getBoundingClientRect(); W = c.width = Math.floor(r.width); H = c.height = Math.floor(r.height); }
      function mk() { return { x: Math.random() * W, y: Math.random() * H, r: .8 + Math.random() * 1.8, s: .25 + Math.random() * .55, d: Math.random() * Math.PI * 2 }; }
      function col() { return getComputedStyle(document.documentElement).getPropertyValue("--snow").trim() || "rgba(255,255,255,.8)"; }
      function tick() {

        for (var i = 0; i < flakes.length; i++) { var f = flakes[i]; f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3;
          if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); }
        raf = requestAnimationFrame(tick);
      }
      function start() { size(); var n = Math.min(90, Math.max(30, Math.floor(W / 12))); flakes = []; for (var i = 0; i < n; i++) flakes.push(mk()); cancelAnimationFrame(raf); tick(); }
      window.addEventListener("resize", start);
      document.addEventListener("visibilitychange", function () { if (document.hidden) cancelAnimationFrame(raf); else tick(); });
      start();
    })();

    /* ---------- 要載哪趟？ ---------- */
    var params = new URLSearchParams(location.search);
    var id = params.get("trip") || (window.TRIPS && window.TRIPS[0] && window.TRIPS[0].id);
    if (!id) { fail("trips/index.js 裡還沒有任何旅程。"); return; }
    var s = document.createElement("script");
    s.src = "trips/" + encodeURIComponent(id) + ".js";
    s.onload = function () { if (window.TRIP) render(window.TRIP); else fail("trips/" + id + ".js 沒有定義 window.TRIP。"); };
    s.onerror = function () { fail("找不到 trips/" + id + ".js。檢查網址的 ?trip= 是否正確。"); };
    document.head.appendChild(s);

    function fail(msg) {
      $("trip-title").textContent = "找不到這趟旅程";
      var d = $("days"); d.innerHTML = ""; var e = el("div", "empty"); e.appendChild(el("b", null, "載入失敗")); e.appendChild(document.createTextNode(msg)); d.appendChild(e);
      $("stays").hidden = true; $("todos").hidden = true; $("notes").hidden = true;
    }

    function iconTransit(leg) {
      var ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
      s.setAttribute("width", "14"); s.setAttribute("height", "14"); s.setAttribute("viewBox", "0 0 16 16");
      s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.5"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
      var d = leg === "drive"
        ? "M2.5 9.5 4 5.5h8l1.5 4M2.5 9.5h11v3h-1.5a1.5 1.5 0 0 1-3 0h-2a1.5 1.5 0 0 1-3 0H2.5v-3Z"
        : "M4.5 2.5h7a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 10V4a1.5 1.5 0 0 1 1.5-1.5ZM3 6.5h10M5.5 9h.01M10.5 9h.01M5 11.5 3.5 14M11 11.5 12.5 14";
      var p = document.createElementNS(ns, "path"); p.setAttribute("d", d); s.appendChild(p); return s;
    }

    /* 時間線上的分類圖示 */
    var ICONS = {
      move: "M4.5 2.5h7a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 10V4a1.5 1.5 0 0 1 1.5-1.5ZM3 6.5h10M5.5 9h.01M10.5 9h.01M5 11.5 3.5 14M11 11.5 12.5 14",
      drive: "M2.5 9.5 4 5.5h8l1.5 4M2.5 9.5h11v3h-1.5a1.5 1.5 0 0 1-3 0h-2a1.5 1.5 0 0 1-3 0H2.5v-3Z",
      see: "M2.5 5.5h2l1-2h5l1 2h2v7h-11v-7ZM8 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z",
      eat: "M2.5 7.5h11a5.5 5.5 0 0 1-11 0ZM5 13.5h6M3 4.5l1-1.5M8 4V2.5M13 4.5l-1-1.5",
      lit: "M8 2a4 4 0 0 0-2.5 7.1V11h5V9.1A4 4 0 0 0 8 2ZM6.5 13h3M7 14.5h2",
      stay: "M2.5 12.5v-7M2.5 10h11v2.5M13.5 10V8a1.5 1.5 0 0 0-1.5-1.5H7V10M3.5 7.5A1.5 1.5 0 1 1 6 6.5",
      warn: "M8 2.5 14 13H2L8 2.5ZM8 6.5v3M8 11.2v.01",
      fly: "M2.5 9.5 7 8l2.5-5h2L10 8l3.5 1.5-1 1-3-.5-1.5 3.5h-1.5L7 10.5l-3 .5-1.5-1.5Z",
      walk: "M9 2.5a1 1 0 1 0 0 .01M6.5 14l1.5-4 2 1.5V14M7 7.5 5.5 10.5M7 7.5l2.5 1 1.5 2.5M7 7.5l-2 1-1 2"
    };
    var MODE_ICON = { fly: "fly", walk: "walk", drive: "drive", taxi: "drive", rail: "move", bus: "move" };
    function iconKind(k, leg, mode) {
      var ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
      s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
      s.setAttribute("stroke-width", "1.6"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
      var key = k === "move" ? (MODE_ICON[mode] || (leg === "drive" ? "drive" : "move")) : k;
      var p = document.createElementNS(ns, "path"); p.setAttribute("d", ICONS[key] || ICONS.see); s.appendChild(p); return s;
    }
    function mins(t) { var m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }

    function render(T) {
      document.title = T.title + " · 行程";
      $("trip-title").textContent = T.title;
      $("trip-range").textContent = T.range || "";
      if (T.mode) { $("trip-mode").textContent = T.mode; $("trip-mode").hidden = false; }
      renderCountdown(T); renderDays(T); renderStays(T); renderCosts(T); renderSpend(T); renderTodos(T); renderNotes(T);
      renderRoute(T); renderRail(T);   // 導覽最後建：要觀察 #day-N，卡片得先存在
      $("foot").innerHTML = "";
      $("foot").appendChild(document.createTextNode("資料檔："));
      $("foot").appendChild(el("code", null, "trips/" + T.id + ".js"));
      if (T.updated) $("foot").appendChild(document.createTextNode(" · 更新 " + T.updated));
    }

    /* ---------- 路線圖 ---------- */
    function renderRoute(T) {
      var ol = $("route"); ol.innerHTML = "";
      var days = T.days || []; if (!days.length) return;
      var anyLeg = false;
      days.forEach(function (d) {
        var li = el("li"); var a = el("a", "stop" + (d.leg ? " leg-" + d.leg : "")); a.href = "#day-" + d.n; a.dataset.day = d.n;
        if (d.leg) anyLeg = true;

        a.appendChild(el("span", "dn", "D" + d.n));
        a.appendChild(el("span", "dot"));
        a.appendChild(el("span", "pl", d.place || ("Day " + d.n)));
        a.appendChild(el("span", "dt", d.date || ""));
        li.appendChild(a); ol.appendChild(li);
      });
      $("legend").hidden = !anyLeg;
    }

    /* ---------- sticky 小導覽＋捲動同步（也同步路線圖） ---------- */
    function renderRail(T) {
      var rail = $("rail"); rail.innerHTML = "";
      (T.days || []).forEach(function (d) { var a = el("a", null, "D" + d.n); a.href = "#day-" + d.n; rail.appendChild(a); });
      [["sec-stay", "住宿"], ["sec-cost", "費用"], ["sec-todo", "待辦"], ["sec-talk", "討論"]].forEach(function (x) { var a = el("a", null, x[1]); a.href = "#" + x[0]; rail.appendChild(a); });
      var links = rail.querySelectorAll("a");
      var targets = Array.prototype.map.call(links, function (a) { return document.getElementById(a.getAttribute("href").slice(1)); });
      var stops = document.querySelectorAll(".stop");
      function setOn(i) {
        Array.prototype.forEach.call(links, function (b, j) { b.classList.toggle("on", j === i); });
        Array.prototype.forEach.call(stops, function (st, j) { st.classList.toggle("on", j === i); });
      }
      Array.prototype.forEach.call(links, function (a, i) { a.addEventListener("click", function () { setOn(i); }); });
      Array.prototype.forEach.call(stops, function (st, i) { st.addEventListener("click", function () { setOn(i); }); });

        entries.forEach(function (e) { if (!e.isIntersecting) return; var i = targets.indexOf(e.target); if (i >= 0) setOn(i); });
      }, { rootMargin: "-70px 0px -65% 0px" });
      targets.forEach(function (t) { if (t) obs.observe(t); });
      setOn(0);   // 載入時先亮第一站，等捲動事件來再換
    }

    /* ---------- 每日 ---------- */
    function isRide(it) { return (it.kind || "see") === "move" && (it.from || it.to); }
    function rideLabel(it) { return (it.from || "") + " → " + (it.to || "") + (it.via ? "（" + it.via + "）" : ""); }
    // 乘車券卡片：from/to/via/arr/dur 排頭，board/alight/fare/ticket/note 列成表
    function rideNode(it) {
      var r = el("div", "ride");
      var h = el("div", "rhead"), route = el("div", "route");
      route.appendChild(el("span", null, it.from || "")); route.appendChild(el("span", "arrow", "→")); route.appendChild(el("span", null, it.to || ""));
      h.appendChild(route);
      var right = el("div", "kindrow");
      if (it.via) right.appendChild(el("span", "via", it.via));
      if (it.routeUrl) { var ra = el("a", "map", "路線 ↗"); ra.href = it.routeUrl; ra.target = "_blank"; ra.rel = "noopener"; ra.title = "Google 路線：起點到終點"; right.appendChild(ra); }
      if (it.url) { var a = el("a", "map", "目的地 ↗"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; right.appendChild(a); }
      h.appendChild(right); r.appendChild(h);
      if (it.time || it.arr || it.dur) {
        var t = el("div", "rtime");
        if (it.time) t.appendChild(el("b", null, it.time));
        if (it.arr) { t.appendChild(el("span", "arrow", "→")); t.appendChild(el("b", null, it.arr)); }
        if (it.dur) t.appendChild(el("span", "dur", it.dur));
        r.appendChild(t);
      }
      var rows = [["上車", it.board, true], ["下車", it.alight, false], ["票價", it.fare, false], ["買票", it.ticket, false], ["備註", it.note, false]]
        .filter(function (x) { return x[1]; });
      if (rows.length) {
        var dl = el("dl");
        rows.forEach(function (x) {
          dl.appendChild(el("dt", null, x[0])); var dd = el("dd", x[2] ? "hl" : null, x[1]);
          if (x[2] && it.boardUrl) { var b = el("a", "map", "上車處 ↗"); b.href = it.boardUrl; b.target = "_blank"; b.rel = "noopener"; dd.appendChild(b); }
          dl.appendChild(dd);
        });
        r.appendChild(dl);
      }
      return r;
    }

    function renderDays(T) {
      var host = $("days"); host.innerHTML = "";
      var days = T.days || [];
      $("plan-sub").textContent = days.length ? days.length + " 天" : "";
      if (!days.length) { var e = el("div", "empty"); e.appendChild(el("b", null, "還沒排行程")); host.appendChild(e); return; }
      var todayN = tripDayN(T);
      days.forEach(function (d) {
        var card = el("article", "day" + (d.leg ? " leg-" + d.leg : "") + (d.n === todayN ? " today" : "")); card.id = "day-" + d.n;
        var head = el("div", "dhead");
        var num = el("div", "dnum"); num.appendChild(el("small", null, "DAY")); num.appendChild(document.createTextNode(String(d.n))); head.appendChild(num);
        var meta = el("div", "dmeta");
        var dd = el("div", "ddate"); dd.appendChild(el("span", null, (d.date || "") + (d.weekday ? "（" + d.weekday + "）" : "")));
        if (d.place) dd.appendChild(el("span", "place", d.place));
        if (d.n === todayN) dd.appendChild(el("span", "todaytag", "今天"));
        meta.appendChild(dd);
        meta.appendChild(el("div", "dtitle", d.title || ""));
        if (d.transport) { var tr = el("div", "dtrans"); tr.appendChild(iconTransit(d.leg)); tr.appendChild(el("span", null, d.transport)); meta.appendChild(tr); }
        head.appendChild(meta); card.appendChild(head);
        if (d.img) { var img = el("img", "cover"); img.src = d.img; img.alt = d.title || ""; img.loading = "lazy"; card.appendChild(img); }

        // 日照時間軸：06:00–24:00，日出前與日落後是夜色；每個有時間的項目在真實位置落一個色點，點一下跳到該項目
        if (d.sun && d.sun.set) {
          var T0 = 6 * 60, T1 = 24 * 60, span = T1 - T0;
          var pct = function (m) { return Math.min(100, Math.max(0, (m - T0) / span * 100)); };
          var setPct = pct(mins(d.sun.set)), risePct = d.sun.rise ? pct(mins(d.sun.rise)) : 0;
          var bar = el("div", "daybar");
          var cap = el("div", "cap"); var capL = el("span"); capL.appendChild(el("b", null, "今日時間軸 06:00–24:00"));
          capL.appendChild(document.createTextNode("　淺色白天、深色夜晚；色點是行程，點一下跳過去")); cap.appendChild(capL);
          var lg = el("div", "legend");
          ["move", "see", "eat", "lit", "stay"].forEach(function (k) { var sp = el("span", "k-" + k); sp.appendChild(el("i")); sp.appendChild(document.createTextNode(KINDS[k])); lg.appendChild(sp); });
          cap.appendChild(lg); bar.appendChild(cap);
          var track = el("div", "track"); track.style.setProperty("--set", setPct.toFixed(1) + "%"); track.style.setProperty("--rise", risePct.toFixed(1) + "%");
          for (var hh = 9; hh < 24; hh += 3) { var hr = el("span", "hr"); hr.style.left = pct(hh * 60) + "%"; track.appendChild(hr); }
          (d.items || []).forEach(function (it, i) {
            var m = mins(it.time); if (m == null) return;
            var pt = el("span", "pt k-" + (it.kind || "see") + (it.kind === "lit" ? " lit" : "")); pt.style.left = pct(m) + "%";
            pt.title = (it.time || "") + " " + (isRide(it) ? rideLabel(it) : (it.text || ""));
            pt.addEventListener("click", function () { var li = document.getElementById("day-" + d.n + "-it-" + i); if (li) { li.scrollIntoView({ behavior: "smooth", block: "center" }); li.classList.add("flash"); setTimeout(function () { li.classList.remove("flash"); }, 1600); } });
            track.appendChild(pt);
          });
          bar.appendChild(track);
          var ticks = el("div", "ticks");
          for (var th = 6; th <= 24; th += 3) {
            var tp = pct(th * 60); if (Math.abs(tp - setPct) < 7) continue;   // 跟日落標籤重疊就不畫
            var ts = el("span", th === 6 ? "first" : (th === 24 ? "last" : (th % 6 ? "minor" : null)), (th < 10 ? "0" : "") + th + ":00"); ts.style.left = tp + "%"; ticks.appendChild(ts);
          }
          var setL = el("span", "set", "日落 " + d.sun.set); setL.style.left = setPct + "%"; ticks.appendChild(setL);
          bar.appendChild(ticks);
          card.appendChild(bar);
        }

        var ul = el("ul", "items");
        (d.items || []).forEach(function (it, idx) {
          var k = it.kind || "see";
          var li = el("li", "it k-" + k + (k === "warn" ? " warn" : "") + (k === "lit" ? " lit" : "")); li.id = "day-" + d.n + "-it-" + idx;
          li.appendChild(el("div", "time", it.time || ""));
          var tl = el("div", "tl"), ic = el("i"); ic.appendChild(iconKind(k, d.leg, it.mode)); tl.appendChild(ic); li.appendChild(tl);
          var body = el("div", "body");
          var kr = el("div", "kindrow"); kr.appendChild(el("span", "kind", KINDS[k] || "景點"));
          if (isRide(it)) {
            if (it.booked) kr.appendChild(el("span", "booked", "已劃位"));
            else if (it.ticket) kr.appendChild(el("span", "ticket", "待訂"));
            body.appendChild(kr);
            if (it.text) body.appendChild(el("div", "text", it.text));
            body.appendChild(rideNode(it));
          } else {
            if (/✅|已訂/.test(it.text || "")) kr.appendChild(el("span", "booked", "已訂位"));
            body.appendChild(kr);
            var tx = el("div", "text", it.text || "");
            if (it.url) { var a = el("a", "map", "地圖 ↗"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; tx.appendChild(a); }
            body.appendChild(tx);
          }
          li.appendChild(body); ul.appendChild(li);
        });
        card.appendChild(ul); host.appendChild(card);
      });
    }

    /* ---------- 住宿（桌機表格、手機卡片） ---------- */
    function renderStays(T) {
      var host = $("stays"); host.innerHTML = "";
      var rows = T.stays || [];
      if (!rows.length) { var e = el("div", "empty"); e.appendChild(el("b", null, "還沒填住宿")); host.appendChild(e); return; }
      var ppl = Number(T.travelers) || 2, totN = 0, totP = 0;
      rows.forEach(function (s) { totN += Number(s.nights) || 0; totP += Number(s.price) || 0; });
      function per(s) { var n = Number(s.nights) || 0; return n ? Math.round((Number(s.price) || 0) / n) : 0; }
      function nameNode(s) { var n = el("div", "name"); if (s.url) { var a = el("a", null, s.name); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; n.appendChild(a); } else n.textContent = s.name || ""; return n; }

      var wrap = el("div", "tablewrap"), t = el("table"), thead = el("thead"), hr = el("tr");
      ["飯店", "入住 → 退房", "晚", "金額", "每晚"].forEach(function (h, i) { hr.appendChild(el("th", i >= 2 ? "num" : null, h)); });
      thead.appendChild(hr); t.appendChild(thead);
      var tb = el("tbody");
      rows.forEach(function (s) {
        var tr = el("tr");
        var c1 = el("td"); c1.appendChild(nameNode(s)); if (s.area) c1.appendChild(el("div", "area", s.area)); if (s.note) c1.appendChild(el("div", "flagnote", s.note)); tr.appendChild(c1);
        tr.appendChild(el("td", null, (s.checkin || "") + " → " + (s.checkout || "")));
        tr.appendChild(el("td", "num", String(s.nights || "")));
        tr.appendChild(el("td", "num", fmt(s.price)));
        tr.appendChild(el("td", "num per", per(s) ? fmt(per(s)) : "—"));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      var tf = el("tfoot"), fr = el("tr");
      fr.appendChild(el("td", null, "合計 · 每人 " + fmt(Math.round(totP / ppl)))); fr.appendChild(el("td", null, ""));
      fr.appendChild(el("td", "num", String(totN))); fr.appendChild(el("td", "num", fmt(totP)));
      fr.appendChild(el("td", "num", totN ? fmt(Math.round(totP / totN)) : "—"));
      tf.appendChild(fr); t.appendChild(tf); wrap.appendChild(t); host.appendChild(wrap);

      var cards = el("div", "staycards");
      rows.forEach(function (s) {
        var c = el("div", "sc");
        c.appendChild(nameNode(s));
        var pr = el("div", "price"); pr.appendChild(el("b", null, fmt(s.price))); pr.appendChild(el("small", null, (s.nights || 0) + " 晚 · 每晚 " + (per(s) ? fmt(per(s)) : "—"))); c.appendChild(pr);
        c.appendChild(el("div", "dates", (s.checkin || "") + " → " + (s.checkout || "")));
        if (s.area) c.appendChild(el("div", "area", s.area));
        if (s.note) c.appendChild(el("div", "flagnote", s.note));
        cards.appendChild(c);
      });
      var tot = el("div", "sc total");
      tot.appendChild(el("div", "name", "合計 " + totN + " 晚"));
      var tp = el("div", "price"); tp.appendChild(el("b", null, fmt(totP))); tp.appendChild(el("small", null, "每晚 " + (totN ? fmt(Math.round(totP / totN)) : "—") + " · 每人 " + fmt(Math.round(totP / ppl)))); tot.appendChild(tp);
      cards.appendChild(tot); host.appendChild(cards);
    }

    /* ---------- 倒數 ---------- */
    function parseISO(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null; }
    function todayLocal() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
    // 旅程中回傳今天是第幾天（1 起算），不在旅程期間回傳 null
    function tripDayN(T) { var s = parseISO(T.start); if (!s) return null; var n = dayDiff(s, todayLocal()) + 1; return (n >= 1 && n <= (T.days || []).length) ? n : null; }
    function renderCountdown(T) {
      var box = $("countdown"), s = parseISO(T.start), e = parseISO(T.end); box.innerHTML = "";
      if (!s) { box.hidden = true; return; }
      var t = todayLocal(), toStart = dayDiff(t, s), n = el("div", "n"), l = el("div", "lbl");
      if (toStart > 0) {
        n.appendChild(document.createTextNode(String(toStart))); n.appendChild(el("small", null, "天"));
        l.appendChild(el("b", null, "距離出發")); l.appendChild(document.createTextNode(T.range || T.start));
      } else if (!e || t <= e) {
        var dn = dayDiff(s, t) + 1, d = (T.days || [])[dn - 1];
        n.appendChild(document.createTextNode(String(dn))); n.appendChild(el("small", null, "/ " + (T.days || []).length + " 天"));
        l.appendChild(el("b", null, "旅程進行中，第 " + dn + " 天"));
        if (d) { var a = el("a", null, "今天：" + (d.place ? d.place + " · " : "") + (d.title || "")); a.href = "#day-" + dn; l.appendChild(a); }
      } else {
        var past = dayDiff(e, t);
        n.appendChild(document.createTextNode(String(past))); n.appendChild(el("small", null, "天前"));
        l.appendChild(el("b", null, "旅程已結束")); l.appendChild(document.createTextNode(T.range || ""));
      }
      box.appendChild(n); box.appendChild(l); box.hidden = false;
    }

    /* ---------- 費用 ---------- */
    function toTWD(T, amt, cur) { if (amt == null || amt === "") return null; if (!cur || cur === "TWD") return Math.round(Number(amt)); var r = (T.rate || {})[cur]; return r ? Math.round(Number(amt) * r) : null; }
    function money(amt, cur) { return amt == null || amt === "" ? "—" : (cur === "JPY" ? "¥" : "NT$") + fmt(amt); }
    function stLabel(p) { return p === true ? ["已付", "st-paid"] : p === false ? ["出發前付", "st-due"] : p === "onsite" ? ["現場付", "st-onsite"] : ["待確認", "st-tbd"]; }
    function renderCosts(T) {
      var host = $("costs"); host.innerHTML = "";
      var rows = [];
      (T.stays || []).forEach(function (s) { rows.push({ cat: "住宿", item: (s.name || "") + "（" + (s.nights || 0) + " 晚）", amount: s.price, cur: "TWD", paid: s.paid, date: s.checkin, note: s.payNote }); });
      (T.costs || []).forEach(function (c) { rows.push(c); });
      var rate = (T.rate || {}).JPY;
      $("cost-sub").textContent = rate ? "兩人合計，日圓以 1 JPY = " + rate + " TWD 換算（資料檔 rate 可改）" : "兩人合計";
      if (!rows.length) { var e = el("div", "empty"); e.appendChild(el("b", null, "還沒填費用")); host.appendChild(e); return; }
      var ppl = Number(T.travelers) || 2, tot = 0, paid = 0, due = 0, onsite = 0, unknown = 0, tbd = 0, byCat = {};
      rows.forEach(function (r) {
        var v = toTWD(T, r.amount, r.cur); if (v == null) { tbd++; return; }
        tot += v; var c = r.cat || "其他"; byCat[c] = (byCat[c] || 0) + v;
        if (r.paid === true) paid += v; else if (r.paid === false) due += v; else if (r.paid === "onsite") onsite += v; else unknown += v;
      });
      var k = el("div", "kpis");
      [["總計 TWD", fmt(tot), "每人 " + fmt(Math.round(tot / ppl)) + (tbd ? " · " + tbd + " 筆金額待填" : "")],
       ["已付", fmt(paid), ""], ["出發前要付", fmt(due), unknown ? "另有 " + fmt(unknown) + " 付款狀態待確認" : ""], ["現場付", fmt(onsite), "日圓現金或刷卡"]].forEach(function (x) {
        var c = el("div", "kpi"); c.appendChild(el("div", "k", x[0])); c.appendChild(el("div", "v", x[1])); if (x[2]) c.appendChild(el("div", "s", x[2])); k.appendChild(c);
      });
      host.appendChild(k);
      var wrap = el("div", "costwrap"), t = el("table"), thead = el("thead"), hr = el("tr");
      ["項目", "金額", "狀態"].forEach(function (x, i) { hr.appendChild(el("th", i === 1 ? "num" : null, x)); });
      thead.appendChild(hr); t.appendChild(thead);
      var tb = el("tbody");
      rows.forEach(function (r) {
        var tr = el("tr"), c1 = el("td"); c1.appendChild(el("div", "name", r.item || ""));
        var sub = [r.cat || "其他", r.date, r.note].filter(Boolean).join(" · "); if (sub) c1.appendChild(el("div", "sub", sub)); tr.appendChild(c1);
        var c2 = el("td", "num per", money(r.amount, r.cur)); var v = toTWD(T, r.amount, r.cur); if (r.cur === "JPY" && v != null) c2.appendChild(el("span", "twd", "≈ NT$" + fmt(v))); tr.appendChild(c2);
        var st = stLabel(r.paid), c3 = el("td"); c3.appendChild(el("span", "st " + st[1], st[0])); tr.appendChild(c3);
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      var tf = el("tfoot"), fr = el("tr"); fr.appendChild(el("td", null, "合計 · 每人 NT$" + fmt(Math.round(tot / ppl)))); fr.appendChild(el("td", "num", "NT$" + fmt(tot))); fr.appendChild(el("td", null, "")); tf.appendChild(fr); t.appendChild(tf);
      wrap.appendChild(t); host.appendChild(wrap);
      var cats = el("div", "cats");
      Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).forEach(function (c) { var sp = el("span", null, c); sp.appendChild(el("b", null, fmt(byCat[c]))); cats.appendChild(sp); });
      host.appendChild(cats);
    }

    /* ---------- 旅途記帳（localStorage，每台裝置各自一份，用匯出／匯入合併） ---------- */
    function renderSpend(T) {
      var host = $("spend"); host.innerHTML = "";
      var KEY = "triplog." + T.id + ".spend", order = (T.days || []).map(function (d) { return d.date; });
      function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { return []; } }
      function save() { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
      var list = load();
      host.appendChild(el("h3", null, "旅途記帳"));
      host.appendChild(el("p", "hint", "出門後在手機上記，存在這台裝置的瀏覽器裡。按「匯出」把內容傳給旅伴，對方貼上按「匯入」就會合併。"));
      var f = el("form", "sform");
      var dSel = el("select"); (T.days || []).forEach(function (d) { var o = el("option", null, "D" + d.n + " " + (d.date || "") + (d.place ? " " + d.place : "")); o.value = d.date || ("D" + d.n); dSel.appendChild(o); });
      var tn = tripDayN(T); if (tn) dSel.value = (T.days[tn - 1] || {}).date;
      var cSel = el("select"); ["餐飲", "交通", "門票", "購物", "住宿", "其他"].forEach(function (c) { var o = el("option", null, c); o.value = c; cSel.appendChild(o); });
      var item = el("input", "wide"); item.placeholder = "項目，例如 大黑屋晚餐"; item.required = true; item.maxLength = 60;
      var amt = el("input"); amt.type = "number"; amt.inputMode = "decimal"; amt.placeholder = "金額 ¥"; amt.required = true; amt.min = "0"; amt.step = "1";
      var bySel = el("select"); ["共同", "我付", "旅伴付"].forEach(function (c) { var o = el("option", null, c); o.value = c; bySel.appendChild(o); });
      var btn = el("button", "wide", "＋ 記一筆"); btn.type = "submit";
      [dSel, cSel, item, amt, bySel, btn].forEach(function (x) { f.appendChild(x); });
      f.addEventListener("submit", function (ev) {
        ev.preventDefault(); var v = Number(amt.value); if (!item.value.trim() || !(v >= 0)) return;
        list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: dSel.value, cat: cSel.value, item: item.value.trim(), amt: v, by: bySel.value, at: new Date().toISOString() });
        save(); item.value = ""; amt.value = ""; draw(); item.focus();
      });
      host.appendChild(f);
      var listHost = el("div", "slist"), totalHost = el("div", "stotal"); host.appendChild(listHost); host.appendChild(totalHost);
      var tools = el("div", "stools"), ta = el("textarea"), msg = el("span", "msg"); ta.hidden = true; ta.placeholder = "貼上旅伴匯出的內容，再按一次「匯入」";
      var bEx = el("button", "ghost", "匯出"), bIm = el("button", "ghost", "匯入"), bClr = el("button", "ghost", "清除全部");
      [bEx, bIm, bClr].forEach(function (b) { b.type = "button"; tools.appendChild(b); });
      tools.appendChild(msg); host.appendChild(tools); host.appendChild(ta);
      bEx.addEventListener("click", function () {
        ta.hidden = false; ta.value = JSON.stringify(list); ta.select();
        if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = "已複製到剪貼簿，傳給旅伴即可"; }, function () { msg.textContent = "請自行複製下面的內容"; });
        else msg.textContent = "請自行複製下面的內容";
      });
      bIm.addEventListener("click", function () {
        if (ta.hidden) { ta.hidden = false; ta.value = ""; ta.focus(); msg.textContent = "貼上後再按一次「匯入」"; return; }
        try {
          var inc = JSON.parse(ta.value || "[]"), ids = {}, n = 0; list.forEach(function (x) { ids[x.id] = 1; });
          (inc || []).forEach(function (x) { if (x && x.id && !ids[x.id] && typeof x.item === "string") { list.push({ id: String(x.id), date: String(x.date || ""), cat: String(x.cat || "其他"), item: x.item.slice(0, 60), amt: Number(x.amt) || 0, by: String(x.by || "共同"), at: String(x.at || "") }); ids[x.id] = 1; n++; } });
          save(); ta.hidden = true; msg.textContent = "匯入 " + n + " 筆"; draw();
        } catch (e) { msg.textContent = "格式不對，要貼「匯出」產生的那段文字"; }
      });
      bClr.addEventListener("click", function () {
        if (bClr.dataset.arm) { list = []; save(); draw(); bClr.textContent = "清除全部"; delete bClr.dataset.arm; msg.textContent = "已清除"; return; }
        bClr.dataset.arm = "1"; bClr.textContent = "再按一次確定清除"; setTimeout(function () { bClr.textContent = "清除全部"; delete bClr.dataset.arm; }, 4000);
      });
      function draw() {
        listHost.innerHTML = ""; totalHost.innerHTML = "";
        if (!list.length) { var e = el("div", "empty"); e.appendChild(el("b", null, "還沒有記帳")); e.appendChild(document.createTextNode("出發後在上面填一筆就會出現在這裡")); listHost.appendChild(e); return; }
        var dates = []; list.forEach(function (x) { if (dates.indexOf(x.date) < 0) dates.push(x.date); });
        dates.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
        var total = 0, by = {}, mine = 0, theirs = 0;
        dates.forEach(function (dt) {
          var g = el("div", "sday"), items = list.filter(function (x) { return x.date === dt; }), sub = 0;
          items.forEach(function (x) { sub += Number(x.amt) || 0; });
          var hd = el("h4"), di = order.indexOf(dt); hd.appendChild(el("span", null, (di >= 0 ? "DAY " + (di + 1) + " · " : "") + dt)); hd.appendChild(el("span", null, "¥" + fmt(sub))); g.appendChild(hd);
          items.forEach(function (x) {
            var r = el("div", "srow"), left = el("div"); left.appendChild(el("div", null, x.item)); left.appendChild(el("div", "m", (x.cat || "") + (x.by && x.by !== "共同" ? " · " + x.by : ""))); r.appendChild(left);
            r.appendChild(el("div", "a", "¥" + fmt(x.amt)));
            var xb = el("button", "x", "×"); xb.type = "button"; xb.title = "刪除這筆"; xb.addEventListener("click", function () { list = list.filter(function (y) { return y.id !== x.id; }); save(); draw(); }); r.appendChild(xb);
            g.appendChild(r);
            var v = Number(x.amt) || 0; total += v; by[x.cat || "其他"] = (by[x.cat || "其他"] || 0) + v;
            if (x.by === "我付") mine += v; else if (x.by === "旅伴付") theirs += v;
          });
          listHost.appendChild(g);
        });
        var twd = toTWD(T, total, "JPY"), s1 = el("span", null, "合計 "); s1.appendChild(el("b", null, "¥" + fmt(total))); if (twd != null) s1.appendChild(document.createTextNode("（約 NT$" + fmt(twd) + "）")); totalHost.appendChild(s1);
        totalHost.appendChild(el("span", null, Object.keys(by).map(function (c) { return c + " ¥" + fmt(by[c]); }).join(" · ")));
        if (mine || theirs) { var diff = Math.round((mine - theirs) / 2); totalHost.appendChild(el("span", null, diff > 0 ? "旅伴應還我 ¥" + fmt(diff) : diff < 0 ? "我應還旅伴 ¥" + fmt(-diff) : "兩人付的一樣多")); }
      }
      draw();
    }

    /* ---------- 待辦 ---------- */
    function renderTodos(T) {
      var host = $("todos"); host.innerHTML = "";
      var todos = T.todos || [];
      if (!todos.length) { $("todo-progress").hidden = true; var e = el("div", "empty"); e.appendChild(el("b", null, "沒有待辦")); host.appendChild(e); return; }
      var done = todos.filter(function (t) { return t.done; }).length;
      $("todo-progress").hidden = false; $("todo-count").textContent = done + " / " + todos.length;
      $("todo-bar").style.width = Math.round(done / todos.length * 100) + "%";
      var cats = []; todos.forEach(function (t) { var c = t.cat || "其他"; if (cats.indexOf(c) < 0) cats.push(c); });
      cats.forEach(function (cat) {
        var g = el("div", "todogroup"); g.appendChild(el("h3", null, cat));
        var ul = el("ul", "todos");
        todos.filter(function (t) { return (t.cat || "其他") === cat; }).forEach(function (t) {
          var li = el("li", "td" + (t.done ? " done" : ""));
          li.appendChild(el("span", "box", t.done ? "✓" : "")); li.appendChild(el("span", "txt", t.text || "")); ul.appendChild(li);
        });
        g.appendChild(ul); host.appendChild(g);
      });
    }

    /* ---------- 討論 ---------- */
    function renderNotes(T) {
      var host = $("notes"); host.innerHTML = "";
      var notes = T.notes || [];
      if (!notes.length) { var e = el("div", "empty"); e.appendChild(el("b", null, "沒有待討論的事")); host.appendChild(e); return; }
      notes.forEach(function (n) {
        var d = el("div", "note"), m = el("div", "nmeta");
        m.appendChild(el("span", "who", n.by || "—")); m.appendChild(el("span", "at", n.at || ""));
        d.appendChild(m); d.appendChild(el("p", null, n.text || "")); host.appendChild(d);
      });
    }
  })();
  </script>
